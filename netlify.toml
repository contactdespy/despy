# ════════════════════════════════════════════
# DESPY — Configuration Netlify
# ════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# Fonts bundlées pour la génération d'images (story-agent)
[functions]
  included_files = ["netlify/functions/_assets/**"]

# ── Redirections ──

# SÉCURITÉ : le dossier publié étant la racine du dépôt, le code source des
# fonctions serait servi en statique (/netlify/functions/*.js) sans ce blocage.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# Fichier de prévisualisation des emails (outil de dev, jamais utile en prod)
[[redirects]]
  from = "/_mail_preview.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/app"
  to = "/despy_app_v23.html"
  status = 301

[[redirects]]
  from = "/application"
  to = "/despy_app_v23.html"
  status = 301

# Icônes PWA — fichiers statiques pré-générés depuis le logo officiel
[[redirects]]
  from = "/icon-192.png"
  to = "/assets/icon-192.png"
  status = 200

[[redirects]]
  from = "/icon-512.png"
  to = "/assets/icon-512.png"
  status = 200

[[redirects]]
  from = "/icon-maskable.png"
  to = "/assets/icon-maskable.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/assets/apple-touch-icon.png"
  status = 200

# Image de partage réseaux sociaux (og:image) — était en 404
[[redirects]]
  from = "/og.png"
  to = "/assets/og.png"
  status = 200

# Landing page dédiée (aimant à leads — campagnes Facebook) : page autonome,
# servie telle quelle (PAS le SPA index.html), pour une conversion maximale.
[[redirects]]
  from = "/guide"
  to = "/guide.html"
  status = 200

# Tableau de bord patron (page autonome, hors SPA : le routeur y efface les
# paramètres d'URL, ce qui a déjà cassé quatre fonctionnalités).
# Non indexée, et l'accès est vérifié DEUX FOIS côté serveur (jeton signé +
# ADMIN_EMAIL) — la page elle-même ne protège rien.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Page de coaching de l'entraînement anti-arnaque (page autonome)
[[redirects]]
  from = "/entrainement"
  to = "/entrainement.html"
  status = 200

# Page d'auto-test (utilisateur connecté s'envoie un test)
[[redirects]]
  from = "/mon-entrainement"
  to = "/mon-entrainement.html"
  status = 200

# Page SEO autonome : « Mon email a-t-il été piraté ? » (indexable, outil gratuit)
[[redirects]]
  from = "/verifier-email-pirate"
  to = "/verifier-email-pirate.html"
  status = 200

# Page dédiée pub locale : visite à domicile Bas-Rhin (67)
[[redirects]]
  from = "/visite-domicile"
  to = "/visite-domicile.html"
  status = 200

# ── URLs propres pour les pages internes (SPA routing) ──
# Ces rewrites servent index.html, et le JS au chargement détecte le path
# et appelle showPage() avec la bonne page. URL conservée dans la barre.

[[redirects]]
  from = "/sos-humain"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy-cleanup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/livret"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tarifs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/comment-ca-marche"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/conseiller"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/qui-sommes-nous"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/carte-arnaques"
  to = "/index.html"
  status = 200

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS pendant 1 an, sous-domaines inclus — protège même si
    # l'utilisateur tape http:// sur un réseau piégé (pas de "preload" :
    # irréversible, inutile ici).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://js.stripe.com https://assets.calendly.com https://connect.facebook.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://assets.calendly.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: https://*.googleusercontent.com; connect-src 'self' https://api.anthropic.com https://*.supabase.co https://api.stripe.com https://accounts.google.com https://calendly.com https://www.facebook.com https://connect.facebook.net https://api.pwnedpasswords.com; frame-src https://js.stripe.com https://accounts.google.com https://calendly.com"

# ── Crons automatiques (optimisés pour limiter la consommation Netlify) ──

# Rapports périodiques — peu fréquents
[functions.weekly-report]
  schedule = "0 9 * * 1"           # Lundi 9h

[functions.monthly-report]
  schedule = "0 9 1 * *"           # 1er du mois 9h

[functions.quarterly-report]
  schedule = "0 10 1 1,4,7,10 *"   # 1er janvier/avril/juillet/octobre

# Surveillance & alertes — fréquence réduite
[functions.cyber-alerts]
  schedule = "0 8 */2 * *"         # Tous les 2 jours à 8h (au lieu de chaque jour)

[functions.national-alerts]
  schedule = "0 9,18 * * *"        # 2×/jour (matin + soir) au lieu de 4×/jour

[functions.hibp-check]
  schedule = "0 7 * * 1"           # Chaque lundi 7h — fuites de données (HIBP)

[functions.hudsonrock-check]
  schedule = "0 7 * * 4"           # Chaque jeudi 7h — appareils infectés (infostealer)
                                   # Surveillance hebdomadaire + alerte push instantanée
                                   # (détection ~3 semaines plus tôt qu'en mensuel).
                                   # Lundi/jeudi décalés pour répartir la charge.

# Marketing — fréquence réduite
[functions.relance-leads]
  schedule = "0 10 * * 2,5"        # Mardi + vendredi 10h (au lieu de chaque jour)

[functions.nurture-leads]
  schedule = "0 10 * * *"          # Chaque jour 10h — mini-formation des leads du guide
                                   # (séquence 4 emails sur ~8 jours, espacés de 2 jours)

[functions.fraud-digest]
  schedule = "0 17 * * 5"          # Vendredi 17h — récap hebdo Alerte Secteur (inscrits gratuits ;
                                   # les premium reçoivent chaque alerte en temps réel)

[functions.onboarding-sequence]
  schedule = "0 11 * * *"          # Chaque jour 11h (important pour les nouveaux inscrits)

[functions.training-cycle]
  schedule = "0 10 * * 2,4"        # Mardi + jeudi 10h — entraînement récurrent.
                                   # Passage fréquent mais envoi RARE : chaque
                                   # membre ne reçoit un test que selon SON rythme
                                   # (mensuel/bimestriel/trimestriel), et le jour
                                   # est tiré au hasard après l'échéance — un test
                                   # attendu à date fixe n'entraînerait à rien.

[functions.monthly-training]
  schedule = "0 8 1 * *"           # 1er du mois 8h — génère « L'arnaque du mois »
                                   # à partir des alertes nationales et des
                                   # signalements réels des membres. Créé en
                                   # BROUILLON : rien n'est visible des clients
                                   # tant que le module n'a pas été validé à la
                                   # main via les boutons de l'email.

[functions.nudge-push]
  schedule = "0 9 * * 3"           # Mercredi 9h UTC (~11h Paris) — notifs « douces »
                                   # de réengagement, RÉSERVÉES aux comptes gratuits
                                   # et anciens abonnés (subscribed = false).
                                   # JAMAIS un abonné Premium actif. 1/semaine max,
                                   # ton « valeur », messages en rotation.

# Agent IA réseaux sociaux — refonte mai 2026
# Passage de 7 posts/semaine à 3 posts/semaine (qualité > quantité)
# Mardi  → scène vécue (storytelling humain)
# Jeudi  → chiffre choc (stat isolée + 1 phrase)
# Samedi → question directe (engagement commentaires)
[functions.social-agent]
  schedule = "30 6 * * 2,4,6"      # 6h30 UTC mar/jeu/sam = 8h30 Paris (été) / 7h30 (hiver)

