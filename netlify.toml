# ════════════════════════════════════════════
# DESPY — Configuration Netlify
# ════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── Redirections ──
[[redirects]]
  from = "/app"
  to = "/despy_app_v23.html"
  status = 301

[[redirects]]
  from = "/application"
  to = "/despy_app_v23.html"
  status = 301

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.anthropic.com https://*.supabase.co https://api.stripe.com; frame-src https://js.stripe.com"

# ── Crons automatiques ──

[functions.weekly-report]
  schedule = "0 9 * * 1"

[functions.monthly-report]
  schedule = "0 9 1 * *"

[functions.cyber-alerts]
  schedule = "0 8 * * *"

[functions.relance-leads]
  schedule = "0 10 * * *"

[functions.onboarding-sequence]
  schedule = "0 11 * * *"

[functions.hibp-check]
  schedule = "0 7 1 * *"

[functions.quarterly-report]
  schedule = "0 10 1 1,4,7,10 *"
