<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entraînement anti-arnaque — Despy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon-192.png">
<style>
  :root{--dark:#0A1F3A;--blue:#2D5BFF;--cyan:#5EE4FF;--ink:#111827;--grey:#6B7280;
    --green:#16A34A;--greenbg:#EAF7EF;--amber:#D97706;--amberbg:#FEF6E7;--soft:#E3E8F0;--pale:#F5F8FF;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:#f3f6fb;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header{background:var(--dark);padding:16px 0;text-align:center}
  .logo{color:#fff;font-weight:900;font-size:20px;letter-spacing:.04em}
  .logo span{color:var(--cyan)}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(10,31,58,.12);margin:22px auto;overflow:hidden}
  .banner{background:var(--greenbg);padding:30px 24px;text-align:center;border-bottom:1px solid #d6efe0}
  .check{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;line-height:66px;margin:0 auto 14px}
  .banner h1{font-size:23px;color:var(--green);margin-bottom:8px}
  .banner p{font-size:15.5px;color:#33694e}
  .body{padding:26px 24px}
  .lead{font-size:16px;color:var(--ink);margin-bottom:22px;line-height:1.6}
  .lead b{color:var(--dark)}
  .sect-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin:0 0 12px}
  .flag{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
  .flag .ic{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:var(--amberbg);color:var(--amber);
    font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
  .flag span{font-size:14.5px;color:#444}
  .reflex{background:var(--greenbg);border-radius:13px;padding:18px 20px;margin-top:8px}
  .reflex .t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:8px}
  .reflex p{font-size:15.5px;color:#0f5132;line-height:1.6}
  .footnote{font-size:14px;color:var(--grey);text-align:center;padding:4px 24px 22px;line-height:1.6}
  .cta{display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;
    font-size:16px;padding:15px;border-radius:12px;margin:0 24px 26px}
  .loading{text-align:center;padding:50px 24px;color:var(--grey);font-size:15px}
  footer{text-align:center;font-size:12px;color:var(--grey);padding:10px 0 26px}
  footer a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">Despy<span>.</span></div></div></header>

<div class="wrap">
  <div class="card">
    <div class="banner">
      <div class="check">✓</div>
      <h1>Pas de panique — c'était un test&nbsp;!</h1>
      <p>Ce message était un <b>entraînement Despy</b>, totalement sans danger. Aucune donnée n'a été transmise, rien ne vous a été pris.</p>
    </div>
    <div id="content" class="loading">Chargement de votre débrief…</div>
  </div>
  <footer>Despy · Entraînement anti-arnaque · <a href="https://despy.fr">despy.fr</a></footer>
</div>

<script>
  function param(n){ return new URLSearchParams(location.search).get(n); }
  var token = param('t');
  var box = document.getElementById('content');

  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function render(data){
    var prenom = data.prenom ? (esc(data.prenom) + ', vous') : 'Vous';
    var flags = (data.redFlags||[]).map(function(f,i){
      return '<div class="flag"><div class="ic">'+(i+1)+'</div><span>'+esc(f)+'</span></div>';
    }).join('');
    box.className = '';
    box.innerHTML =
      '<div class="body">'
      + '<p class="lead">'+prenom+' venez de vous entraîner sur un test : <b>'+esc(data.title||'arnaque')+'</b>'
      + (data.brand ? ' (imitation '+esc(data.brand)+')' : '')
      + '. Dans la vraie vie, ce message aurait pu vous coûter cher. Voici ce qui aurait dû vous alerter :</p>'
      + '<div class="sect-title">Les indices à repérer</div>'
      + flags
      + '<div class="reflex"><div class="t">Le bon réflexe</div><p>'+esc(data.reflex||'')+'</p></div>'
      + '</div>'
      + '<p class="footnote">Bravo d\'avoir joué le jeu&nbsp;: c\'est en s\'entraînant qu\'on déjoue les vraies arnaques. La prochaine fois, vous repérerez ce piège&nbsp;!</p>'
      + '<a class="cta" href="https://despy.fr">Revenir sur Despy</a>';
  }

  function fallback(){
    box.className='';
    box.innerHTML='<div class="body"><p class="lead">Ce lien d\'entraînement n\'est plus valable, mais retenez l\'essentiel&nbsp;:</p>'
      + '<div class="reflex"><div class="t">Le bon réflexe, toujours</div><p>En cas de doute&nbsp;: ne cliquez pas, ne payez pas, ne donnez aucune information. Vérifiez en ouvrant vous-même l\'application ou le site officiel, ou demandez à un proche.</p></div></div>'
      + '<a class="cta" href="https://despy.fr">Revenir sur Despy</a>';
  }

  if(!token){ fallback(); }
  else {
    fetch('/.netlify/functions/training-click?t='+encodeURIComponent(token))
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){ if(d && d.ok) render(d); else fallback(); })
      .catch(fallback);
  }
</script>
</body>
</html>
